<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191c" />
    <title>Luring — Orbit Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #17191c;
        background-image: radial-gradient(120% 90% at 50% -10%, rgba(215, 245, 154, 0.09), transparent 60%);
        color: #ecefe7;
        font-family: 'Outfit', 'Segoe UI', 'Helvetica Neue', sans-serif;
        text-align: center;
      }
      .card {
        max-width: 380px;
        padding: 32px 28px;
        border-radius: 26px;
        background: rgba(33, 37, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 10px 12px 26px rgba(0, 0, 0, 0.5);
      }
      img { display: block; margin: 0 auto 18px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: #a2ab9c; font-size: 0.9rem; line-height: 1.55; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 12px 22px;
        border: 0;
        border-radius: 999px;
        background: #d7f59a;
        color: #1b210f;
        cursor: pointer;
      }
      button:hover { background: #c7ee7f; }
      small { display: block; margin-top: 18px; color: #7d8679; font-size: 0.72rem; }
    </style>
